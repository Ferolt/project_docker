name: e-commerce-prod

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: project_docker_frontend:prod-local
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:?VITE_AUTH_SERVICE_URL must be set}
      VITE_PRODUCT_SERVICE_URL: ${VITE_PRODUCT_SERVICE_URL:?VITE_PRODUCT_SERVICE_URL must be set}
      VITE_ORDER_SERVICE_URL: ${VITE_ORDER_SERVICE_URL:?VITE_ORDER_SERVICE_URL must be set}
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: production
    image: project_docker_auth-service:prod-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTH_PORT:-3101}:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGODB_URI: ${AUTH_MONGODB_URI:?AUTH_MONGODB_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      auth-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
      target: production
    image: project_docker_product-service:prod-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCT_PORT:-3100}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: ${PRODUCT_MONGODB_URI:?PRODUCT_MONGODB_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      product-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
      target: production
    image: project_docker_order-service:prod-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORDER_PORT:-3102}:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      MONGODB_URI: ${ORDER_MONGODB_URI:?ORDER_MONGODB_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      VITE_PRODUCT_SERVICE_URL: ${VITE_PRODUCT_SERVICE_URL:?VITE_PRODUCT_SERVICE_URL must be set}
    depends_on:
      order-mongodb:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  auth-mongodb:
    image: mongo:4.4
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - auth_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  product-mongodb:
    image: mongo:4.4
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - product_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

  order-mongodb:
    image: mongo:4.4
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - order_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  auth_mongodb_data:
  product_mongodb_data:
  order_mongodb_data:
